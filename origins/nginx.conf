location /static/ {
  alias /usr/share/nginx/html/widgets/react-widget-agenda/static/;
}

location = /mfe-config.json {
  alias /usr/share/nginx/html/widgets/react-widget-agenda/mfe-config.json;
}

location ~ /js/keycloak\.js$ {
  rewrite ^ /auth/js/keycloak.js break;
  proxy_pass http://localhost:9080;
}

}
